name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            bundles: msi,nsis
          - name: macos-intel
            runner: macos-15-intel
            bundles: dmg
          - name: macos-apple-silicon
            runner: macos-15
            bundles: dmg
          - name: linux-x64
            runner: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libfuse2 \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            wget

      - name: Verify release version
        run: node apps/desktop/scripts/verify-release-version.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build desktop installers
        run: pnpm --filter @spacecom-encounter-analyzer/desktop tauri build --bundles ${{ matrix.bundles }}

      - name: Package portable Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portableDirectory = "portable/Spacecom Encounter Analyzer"
          New-Item -ItemType Directory -Path $portableDirectory -Force | Out-Null
          Copy-Item "apps/desktop/src-tauri/target/release/desktop.exe" "$portableDirectory/Spacecom Encounter Analyzer.exe"
          Copy-Item "apps/desktop/src-tauri/resources" "$portableDirectory/resources" -Recurse
          @"
          Spacecom Encounter Analyzer (portable)

          Extract this folder and run "Spacecom Encounter Analyzer.exe".
          Microsoft Edge WebView2 Runtime is required.

          Analizador de Encuentros Espaciales (portable)

          Extrae esta carpeta y ejecuta "Spacecom Encounter Analyzer.exe".
          Se requiere Microsoft Edge WebView2 Runtime.
          "@ | Set-Content "$portableDirectory/README.txt"
          Compress-Archive -Path "$portableDirectory/*" -DestinationPath "portable/Spacecom-Encounter-Analyzer_${env:GITHUB_REF_NAME}_windows-x64_portable.zip"

      - name: Upload build assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/*/*
            portable/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          body: |
            **macOS:** DMG files are not signed or notarized. macOS Gatekeeper may block the app; users may need to allow it manually in System Settings.

            **Windows portable:** Extract the `windows-x64_portable.zip` file and run `Spacecom Encounter Analyzer.exe`. Microsoft Edge WebView2 Runtime is required.

            **Windows:** Installers are unsigned and may trigger SmartScreen warnings.
          files: |
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.zip
            release-assets/**/*.dmg
            release-assets/**/*.deb
            release-assets/**/*.AppImage
